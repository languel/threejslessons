# Deploys the lessons to GitHub Pages. The model and runtime files are not in the repository: the workflow fetches them
# (fetch-mediapipe.sh, the same script as `npm run models`) and publishes them with the site, so every lesson runs.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch models and runtimes
        run: sh fetch-mediapipe.sh
      - name: Assemble the site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='test' --exclude='exports' --exclude='_site' --exclude='*.py' --exclude='package*.json' ./ _site/
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
